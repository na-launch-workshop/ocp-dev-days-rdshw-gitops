---
# ServiceAccount, Role, and RoleBinding that grant permission to approve
# InstallPlans in the release namespace. The dev-spaces-installplan-approve
# Job uses this account to patch InstallPlans and set spec.approved to true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-spaces-installplan-approver
  annotations:
    {{- include "devspaces-operator.argocd-syncwave" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-spaces-installplan-approver
  annotations:
    {{- include "devspaces-operator.argocd-syncwave" . | nindent 4 }}
rules:
  - apiGroups:
      - "operators.coreos.com"
    resources:
      - "installplans"
    verbs:
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev-spaces-installplan-approver
  annotations:
    {{- include "devspaces-operator.argocd-syncwave" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: dev-spaces-installplan-approver
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: dev-spaces-installplan-approver
  apiGroup: rbac.authorization.k8s.io
