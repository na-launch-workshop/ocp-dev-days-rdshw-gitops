apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-credentials
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.vault.secretStore }}
    kind: ClusterSecretStore
  target:
    name: llm-credentials
    creationPolicy: Owner
    template:
      data:
        apitoken: "{{ printf "{{ .api_key }}" }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.vault.secretPath }}
        property: api_key
