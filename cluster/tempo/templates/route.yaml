apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tempo-tempo-query-frontend
  namespace: {{ .Values.tempoStack.namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: "120s"
spec:
  port:
    targetPort: oauth-proxy
  tls:
    termination: reencrypt
  to:
    kind: Service
    name: tempo-tempo-query-frontend
    weight: 100
