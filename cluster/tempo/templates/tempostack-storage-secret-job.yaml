apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempostack-storage-setup
  namespace: {{ .Values.tempoStack.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tempostack-storage-setup
  namespace: {{ .Values.tempoStack.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tempostack-storage-setup
  namespace: {{ .Values.tempoStack.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: tempostack-storage-setup
    namespace: {{ .Values.tempoStack.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tempostack-storage-setup
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tempostack-storage-setup
  namespace: {{ .Values.tempoStack.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: tempostack-storage-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              OBC_NAME="{{ .Values.tempoStack.obc.name }}"
              SECRET_NAME="{{ .Values.tempoStack.obc.name }}"
              ENDPOINT="{{ .Values.tempoStack.obc.endpoint }}"

              echo "Waiting for OBC secret and configmap..."
              until oc get secret "$OBC_NAME" -n "{{ .Values.tempoStack.namespace }}" &>/dev/null && \
                    oc get configmap "$OBC_NAME" -n "{{ .Values.tempoStack.namespace }}" &>/dev/null; do
                echo "Waiting..."
                sleep 5
              done

              BUCKET_NAME=$(oc get configmap "$OBC_NAME" -n "{{ .Values.tempoStack.namespace }}" -o jsonpath='{.data.BUCKET_NAME}')
              ACCESS_KEY_ID=$(oc get secret "$OBC_NAME" -n "{{ .Values.tempoStack.namespace }}" -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' | base64 -d)
              ACCESS_KEY_SECRET=$(oc get secret "$OBC_NAME" -n "{{ .Values.tempoStack.namespace }}" -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}' | base64 -d)

              oc create secret generic "${SECRET_NAME}-tempostack" \
                --from-literal=endpoint="${ENDPOINT}" \
                --from-literal=bucket="${BUCKET_NAME}" \
                --from-literal=access_key_id="${ACCESS_KEY_ID}" \
                --from-literal=access_key_secret="${ACCESS_KEY_SECRET}" \
                -n "{{ .Values.tempoStack.namespace }}" \
                --dry-run=client -o yaml | oc apply -f -

              echo "TempoStack storage secret created successfully."
