nameOverride: ""

subscription:
  channel: stable
  installPlanApproval: Automatic
  name: tempo-product
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: ""

tempoStack:
  namespace: tempo
  storageSize: 10Gi

minio:
  # MinIO's own registries (quay.io/minio, docker.io/minio) now require
  # authentication for all tags, so we use Chainguard's public build.
  image: cgr.dev/chainguard/minio:latest
  mcImage: cgr.dev/chainguard/minio-client:latest-dev
  rootUser: minio
  rootPassword: minio123
  bucket: tempo
  storageSize: 10Gi
  storageClassName: ocs-external-storagecluster-ceph-rbd-immediate

tempo:
  host: ""
