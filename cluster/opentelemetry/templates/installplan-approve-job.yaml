apiVersion: batch/v1
kind: Job
metadata:
  name: otel-installplan-approve
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: otel-installplan-approver
      containers:
        - name: patch
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for OpenTelemetry InstallPlan to exist..."

              OPERATOR_NS="openshift-opentelemetry-operator"

              install_plan=""
              until [[ ${install_plan} != "" ]]
              do
                oc get installplan -n ${OPERATOR_NS}
                # Match any InstallPlan for the opentelemetry-operator CSV, approved or not
                install_plan=$(oc get installplan -n ${OPERATOR_NS} -o jsonpath='{.items[?(@.spec.clusterServiceVersionNames[*]=="opentelemetry-operator")].metadata.name}' 2>/dev/null)
                if [[ -z ${install_plan} ]]; then
                  install_plan=$(oc get installplan -n ${OPERATOR_NS} | grep opentelemetry-operator | head -1 | cut -d" " -f1)
                fi
                [[ -z ${install_plan} ]] && sleep 15
              done
              oc patch installplan ${install_plan} -n ${OPERATOR_NS} --type merge --patch '{"spec":{"approved":true }}'
              echo "OpenTelemetry InstallPlan Approved"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
