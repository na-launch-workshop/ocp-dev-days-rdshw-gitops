apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: helpdesk-db
  namespace: {{ .Values.namespace }}
  annotations:
    {{- include "helpdesk.database-syncwave" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.mongodb.storage.size }}
