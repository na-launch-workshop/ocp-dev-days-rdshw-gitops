apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: helpdesk-admin
  namespace: {{ .Values.namespace }}
  annotations:
    {{- include "helpdesk.config-syncwave" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: helpdesk-admin
subjects:
- kind: ServiceAccount
  name: helpdesk-admin
  namespace: {{ .Values.namespace }}
