apiVersion: v1
kind: Service
metadata:
  name: helpdesk
  namespace: {{ .Values.namespace }}
  labels:
    app: helpdesk
  annotations:
    {{- include "helpdesk.workloads-syncwave" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: 8118
    protocol: TCP
    targetPort: 8118
  selector:
    app: helpdesk
  type: ClusterIP
