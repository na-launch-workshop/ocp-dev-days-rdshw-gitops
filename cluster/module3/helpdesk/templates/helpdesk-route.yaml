apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: helpdesk
  namespace: {{ .Values.namespace }}
  labels:
    app: helpdesk
  annotations:
    {{- include "helpdesk.workloads-syncwave" . | nindent 4 }}
spec:
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: helpdesk
    weight: 100
  port:
    targetPort: http
