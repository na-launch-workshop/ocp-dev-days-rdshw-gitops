- route:
    id: cors
    from:
      uri: direct:cors
      steps:
        - setHeader:
            name: Access-Control-Allow-Origin
            simple:
              expression: "*"
        - setHeader:
            name: Access-Control-Allow-Headers
            simple:
              expression: "user"
        - setHeader:
            name: Access-Control-Allow-Methods
            simple:
              expression: "GET, OPTIONS"
        - filter:
            simple: "${header.CamelHttpMethod} == 'OPTIONS'"
            steps:
              - setBody:
                  constant: ""
              - stop: {}

- route:
    id: status
    from:
      uri: platform-http
      parameters:
        path: /status
      steps:
        - to:
            uri: direct:cors
        - setBody:
            simple:
              expression: ok

- route:
    id: fetch-secret
    description: Reusable direct route to fetch lab-credentials from a tenant namespace
    from:
      uri: direct:fetch-secret
      steps:
        - setHeader:
            name: CamelKubernetesNamespaceName
            simple:
              expression: ${sysenv.TENANT_NS_PREFIX}${header.user}${sysenv.TENANT_NS_SUFFIX}
        - setHeader:
            name: CamelKubernetesSecretName
            constant: lab-credentials
        - to:
            uri: kubernetes-secrets:default?operation=getSecret
        - log:
            message: "fetch-secret: namespace=${header.CamelKubernetesNamespaceName}, key=${header.CamelSecretKey}"
        - filter:
            simple: "${body} == null"
            steps:
              - setHeader:
                  name: CamelHttpResponseCode
                  constant: 404
              - setBody:
                  constant: "not found"
              - stop: {}
        - marshal:
            json: {}
        - setBody:
            jq:
              expression: '.data[header("CamelSecretKey")] | @base64d | fromjson'

- route:
    id: openshift
    description: Get OpenShift password for a user
    from:
      uri: platform-http
      parameters:
        path: /credentials/openshift
      steps:
        - to:
            uri: direct:cors
        - setHeader:
            name: CamelSecretKey
            constant: openshift.json
        - to:
            uri: direct:fetch-secret
        - setBody:
            jq:
              expression: '.password'

