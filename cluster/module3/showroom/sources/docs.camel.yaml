- route:
    id: config-s3
    description: Get S3 credentials for a user
    from:
      uri: platform-http
      parameters:
        path: /configuration/s3/{param1}/{param2}
      steps:
        - to:
            uri: direct:cors
        - setHeader:
            name: CamelSecretKey
            constant: s3.json
        - to:
            uri: direct:fetch-secret
        - setVariable:
            name: accessKey
            jq: .accessKey
        - setVariable:
            name: secretKey
            jq: .secretKey
        - setBody:
            simple: "{}"
        - filter:
            simple: ${header.param1} == 'access'
            steps:
              - setBody:
                  simple: ${variable.accessKey}
              - filter:
                  simple: ${header.param2} == 'secret'
                  steps:
                    - setBody:
                        simple: ${body},${variable.secretKey}
        - filter:
            simple: ${header.param1} == 'secret'
            steps:
              - setBody:
                  simple: ${variable.secretKey}
              - filter:
                  simple: ${header.param2} == 'access'
                  steps:
                    - setBody:
                        simple: ${body},${variable.accessKey}
