- route:
    id: room-id
    description: Get Room ID from username
    from:
      uri: platform-http
      parameters:
        path: /roomid
      steps:
        - to:
            uri: direct:cors
        - setBody:
            simple:
              expression: ${header.user}
        - setBody:
            simple:
              expression: ${replace('user','room')}

