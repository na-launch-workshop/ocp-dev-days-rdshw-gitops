apiVersion: v1
kind: ServiceAccount
metadata:
  name: camel-builder
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "camel-flows.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: camel-builder-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "camel-flows.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: camel-builder
    namespace: {{ .Values.namespace }}
