{{- if .Values.admin.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.admin.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.admin.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/module3/admin
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        namespace: {{ .Values.admin.namespace }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
