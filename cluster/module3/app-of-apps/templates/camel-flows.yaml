{{- if .Values.camelFlows.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" .Values.camelFlows.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.camelFlows.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/module3/camel-flows
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        namespace: {{ .Values.camelFlows.namespace }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
