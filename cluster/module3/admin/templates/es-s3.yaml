apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vault-s3
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "admin.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  data:
    - secretKey: accessKey
      remoteRef:
        key: secrets/s3/noobaa
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: secrets/s3/noobaa
        property: secretKey
    - secretKey: endpoint
      remoteRef:
        key: secrets/s3/noobaa
        property: endpoint
  target:
    name: vault-s3
    creationPolicy: Owner
