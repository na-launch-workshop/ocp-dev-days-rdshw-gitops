apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: ai-api-external-entry
  namespace: {{ .Values.llmApi.namespace }}
  labels:
    {{- include "connectivity-link.labels" . | nindent 4 }}
  annotations:
    {{- include "connectivity-link.config-syncwave" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.llmApi.host }}
  exportTo: ["*"]
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: https
      protocol: HTTPS
  resolution: DNS
