apiVersion: batch/v1
kind: Job
metadata:
  name: synapse-create-admin
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: create-admin
        image: {{ .Values.synapse.image }}
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for Synapse to be ready..."
          until curl -sf http://synapse.{{ .Values.namespace }}.svc.cluster.local:8008/_matrix/client/versions > /dev/null 2>&1; do
            echo "Synapse not ready, retrying in 5s..."
            sleep 5
          done
          echo "Synapse is ready, registering admin user..."
          OUTPUT=$(register_new_matrix_user \
            -u {{ .Values.synapse_admin.username }} \
            -p {{ .Values.synapse_admin.password }} \
            -a \
            -c /data/config/homeserver.yaml \
            http://synapse.{{ .Values.namespace }}.svc.cluster.local:8008 2>&1)
          RC=$?
          echo "$OUTPUT"
          if [ $RC -eq 0 ]; then
            echo "Admin user created successfully"
          elif echo "$OUTPUT" | grep -qi "already taken"; then
            echo "Admin user already exists (expected on re-sync)"
          else
            echo "Failed to create admin user"
            exit 1
          fi
        volumeMounts:
        - name: config
          mountPath: /data/config
      volumes:
      - name: config
        configMap:
          name: config
