apiVersion: v1
kind: Service
metadata:
  name: rocketchat
  namespace: {{ .Values.namespace }}
  labels:
    app: rocketchat
  annotations:
    {{- include "rocketchat.workloads-syncwave" . | nindent 4 }}
spec:
  ports:
  - name: 3000-tcp
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: rocketchat
  type: ClusterIP
