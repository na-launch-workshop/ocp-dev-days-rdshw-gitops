apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: {{ .Values.namespace }}
  labels:
    app: mongodb
  annotations:
    {{- include "rocketchat.database-syncwave" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mongodb
        name: mongodb
    spec:
      containers:
      - name: mongodb
        image: {{ .Values.mongodb.image }}
        args:
        - --replSet
        - rs0
        resources:
          requests:
            memory: {{ .Values.mongodb.resources.requests.memory | quote }}
            cpu: {{ .Values.mongodb.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.mongodb.resources.limits.memory | quote }}
            cpu: {{ .Values.mongodb.resources.limits.cpu | quote }}
        env:
        - name: MONGO_INITDB_DATABASE
          value: rocketchat
        ports:
        - containerPort: 27017
          protocol: TCP
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - /etc/db/config/setup.sh > /tmp/replication.output &
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -i
            - -c
            - mongosh "mongodb://127.0.0.1:27017" --eval="quit()"
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -i
            - -c
            - mongosh "mongodb://127.0.0.1:27017" --eval="rs.status()"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /data/configdb
          name: mongodb-configdb
        - mountPath: /data/db
          name: mongodb-db
        - mountPath: /etc/db/config
          name: config
      volumes:
      - name: mongodb-configdb
        persistentVolumeClaim:
          claimName: mongodb
      - name: mongodb-db
        persistentVolumeClaim:
          claimName: mongodb-db
      - name: config
        configMap:
          name: config
          defaultMode: 493
