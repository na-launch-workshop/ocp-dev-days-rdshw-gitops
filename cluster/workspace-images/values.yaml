# Default values for workspace-images chart
nameOverride: ""
namespace: "workspace-images"

# Git repository configuration
git:
  uri: "https://github.com/openshift-dev-days/workspace-images.git"
  ref: "main"
  contextDir: "cekit-builder-image"

# This gitops repo, for images whose source lives in it. The app-of-apps Application
# overrides both with its own repoURL and targetRevision.
build:
  git:
    uri: "https://github.com/na-launch-workshop/ocp-dev-days-rdshw-gitops.git"
    ref: "main"

# Kafka workshop's electricity price API sidecar image, built from this repo
electricityPriceApi:
  contextDir: "cluster/workspace-images/electricity-price-api"

# KEDA workshop's scoreboard images, built from each workshop repo's admin/ directory
nbaScoreboard:
  git:
    uri: "https://github.com/na-launch-workshop/workshop-python-keda-autoscaling.git"
    ref: "main"
    contextDir: "admin"
nbaScoreboardDotnet:
  git:
    uri: "https://github.com/na-launch-workshop/workshop-dotnet-keda-autoscaling.git"
    ref: "main"
    contextDir: "admin"

# Image registry configuration
registry:
  hostname: "image-registry.openshift-image-registry.svc:5000"
  namespace: "workspace-images"
  # The builder image will be built and pushed here
  builderImage: "cekit-builder"
  builderTag: "latest"

# Resource limits for builds and tasks
resources:
  limits:
    cpu: "4"
    memory: "4Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# Additional labels to add to all resources
labels: {}

# Annotations for ArgoCD sync-wave and hooks
annotations: {}