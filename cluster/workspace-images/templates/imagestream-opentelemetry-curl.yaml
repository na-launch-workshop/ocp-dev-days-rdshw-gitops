{{/*
curl poller image for the OpenTelemetry workshops. The dotnet and python
workshops ship an identical curl-cron/ directory, so one image serves both.
The name is referenced by curl-cron/cronjob.yaml in each workshop repo, so
it cannot be changed here alone.
*/}}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: opentelemetry-curl
  labels:
    {{- include "workspace-images.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  lookupPolicy:
    local: false
