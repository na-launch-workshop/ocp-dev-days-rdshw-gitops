apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cekit-class-builder
  labels:
    {{- include "workspace-images.labels" . | nindent 4 }}
  annotations:
    io.kubernetes.cri-o.Devices: '/dev/fuse,/dev/net/tun'
    argocd.argoproj.io/sync-wave: "1"
spec:
  params:
  - name: registry
    type: string
    description: Image registry that built images will be pushed to
    default: {{ .Values.registry.hostname }}
  - name: registry-path
    type: string
    description: Path to the image within the registry
    default: {{ .Values.registry.namespace }}
  - name: image-class
    type: string
    description: The group of images to be built.  base, utility, app-product
  - name: repository
    type: string
    description: The git repository to pull the image and module descriptors from.
    default: {{ .Values.git.uri }}
  - name: revision
    type: string
    description: The repository branch to clone.
    default: {{ .Values.git.ref }}
  stepTemplate:
    securityContext:
      capabilities:
        add:
          - SETGID
          - SETUID
        drop:
          - ALL
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: true
  steps:
  - name: clone
    computeResources: {}
    image: {{ .Values.registry.hostname }}/{{ .Values.registry.namespace }}/{{ .Values.registry.builderImage }}:{{ .Values.registry.builderTag }}
    script: |
      git clone -b $(params.revision) --single-branch $(params.repository) /workspace/source
  - name: build
    computeResources: {}
    image: {{ .Values.registry.hostname }}/{{ .Values.registry.namespace }}/{{ .Values.registry.builderImage }}:{{ .Values.registry.builderTag }}
    workingDir: "/workspace/source"
    env:
    - name: NODE_EXTRA_CA_CERTS
      value: /tekton-custom-certs/ca-bundle.crt
    script: |
      if [ ! -d "${HOME}" ]
      then
        mkdir -p "${HOME}"
      fi
      if [ ! -d "${HOME}/.config/containers" ]
      then
        mkdir -p ${HOME}/.config/containers
        (echo '[storage]';echo 'driver = "overlay"';echo 'graphroot = "/tmp/graphroot"';echo '[storage.options.overlay]';echo 'mount_program = "/usr/bin/fuse-overlayfs"') > ${HOME}/.config/containers/storage.conf
      fi
      if ! whoami &> /dev/null
      then
        if [ -w /etc/passwd ]
        then
          echo "${USER_NAME:-user}:x:$(id -u):0:${USER_NAME:-user} user:${HOME}:/bin/bash" >> /etc/passwd
          echo "${USER_NAME:-user}:x:$(id -u):" >> /etc/group
        fi
      fi
      USER=$(whoami)
      START_ID=$(( $(id -u)+1 ))
      echo "${USER}:${START_ID}:2147483646" > /etc/subuid
      echo "${USER}:${START_ID}:2147483646" > /etc/subgid
      cd images/$(params.image-class)
      for image in $(ls *.yaml)
      do
        IMAGE_NAME=$(yq e ".name" ${image})
        IMAGE_TAG=$(yq e ".version" ${image})
        echo "${IMAGE_NAME}:${IMAGE_TAG}" >> ist.list
        IMAGE="$(params.registry)/$(params.registry-path)/${IMAGE_NAME}:${IMAGE_TAG}"
        cekit --descriptor ${image} build podman --build-flag --volume --build-flag ${NODE_EXTRA_CA_CERTS}:${NODE_EXTRA_CA_CERTS}:ro,Z --build-arg NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS} --build-flag --manifest --build-flag ${IMAGE}
        podman manifest push ${IMAGE}
        podman manifest rm ${IMAGE}
      done
  - name: create-pinnedimageset
    image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
    workingDir: "/workspace/source"
    script: |
      cd images/$(params.image-class)
      cat << EOF > workspace-images-master.yaml
      apiVersion: machineconfiguration.openshift.io/v1
      kind: PinnedImageSet
      metadata:
        name: cekit-builder-images-master$(params.image-class)
        labels:
          machineconfiguration.openshift.io/role: master
      spec:
        pinnedImages:
      EOF
      cat << EOF > workspace-images-worker.yaml
      apiVersion: machineconfiguration.openshift.io/v1
      kind: PinnedImageSet
      metadata:
        name: cekit-builder-images-worker$(params.image-class)
        labels:
          machineconfiguration.openshift.io/role: worker
      spec:
        pinnedImages:
      EOF

      for ist in $(cat ist.list)
      do
        IMAGE_SHA=$(oc get imagestreamtag ${ist} -o jsonpath='{.image.metadata.name}')
        IMAGE_NAME=$(echo ${ist} | cut -d":" -f1)
        IMAGE_REF="$(params.registry)/$(params.registry-path)/${IMAGE_NAME}@${IMAGE_SHA}"
        echo "  - name: ${IMAGE_REF}" >> workspace-images-worker.yaml
        echo "  - name: ${IMAGE_REF}" >> workspace-images-master.yaml
      done
      oc apply -f workspace-images-master.yaml
      oc apply -f workspace-images-worker.yaml
