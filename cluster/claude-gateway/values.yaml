namespace: claude-sandbox

gitlab:
  url: "https://gitlab-gitlab.apps.cluster-x7f6f.dyn.redhatworkshops.io"
  tokenSecret: "gitlab-token"
  authUser: "root"

gateway:
  replicas: 2
  image: image-registry.openshift-image-registry.svc:5000/claude-sandbox/claude-gateway:latest
  tokenTTLSeconds: "14400"
  maxRequestsPerHour: "30"
  signingKey: "REPLACE_ME"
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "500m"
      memory: 256Mi

quota:
  pods: "10"
  requestsCPU: "8"
  requestsMemory: 16Gi
  limitsCPU: "16"
  limitsMemory: 32Gi
