# ------------------------------------------------------------------------------
# To apply the Claude API key:
# - Uncomment the Secret below and set your ANTHROPIC_API_KEY
# - Apply with: oc apply -f configmap-claude-auth.yaml
# - Restart the claude-gateway pods:
#     oc rollout restart deployment/claude-gateway -n claude-sandbox
# ------------------------------------------------------------------------------
# apiVersion: v1
# kind: Secret
# metadata:
#   name: claude-auth
#   namespace: claude-sandbox
#   labels:
#     app.kubernetes.io/part-of: claude-sandbox
# type: Opaque
# stringData:
#   ANTHROPIC_API_KEY: "my-anthropic-api-key"
