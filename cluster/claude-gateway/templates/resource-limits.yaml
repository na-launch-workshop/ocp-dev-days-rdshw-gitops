apiVersion: v1
kind: ResourceQuota
metadata:
  name: claude-sandbox-quota
  namespace: {{ .Values.namespace }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.requestsCPU | quote }}
    requests.memory: {{ .Values.quota.requestsMemory }}
    limits.cpu: {{ .Values.quota.limitsCPU | quote }}
    limits.memory: {{ .Values.quota.limitsMemory }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: claude-sandbox-limits
  namespace: {{ .Values.namespace }}
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 8Gi
    - type: Pod
      max:
        cpu: "4"
        memory: 8Gi
