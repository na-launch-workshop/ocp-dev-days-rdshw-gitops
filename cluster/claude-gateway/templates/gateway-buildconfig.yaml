apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: claude-gateway:latest
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
