apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
spec:
  source:
    type: Git
    git:
      uri: https://github.com/na-launch-workshop/ocp-dev-days-rdshw-gitops.git
      ref: dev
    contextDir: cluster/claude-gateway/gateway
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers:
    - type: ConfigChange
  output:
    to:
      kind: ImageStreamTag
      name: claude-gateway:latest
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
