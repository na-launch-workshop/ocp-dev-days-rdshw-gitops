apiVersion: v1
kind: Service
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
spec:
  selector:
    app.kubernetes.io/name: claude-gateway
  # Each gateway pod keeps a user's conversation history in memory and their cloned repo
  # on a pod-local emptyDir. Pin every client (one workspace pod IP per user) to one
  # gateway pod, for as long as their token lasts, so replicas > 1 don't lose that state.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: {{ .Values.gateway.tokenTTLSeconds }}
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-signing-key
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: claude-sandbox
type: Opaque
stringData:
  key: {{ .Values.gateway.signingKey | quote }}
