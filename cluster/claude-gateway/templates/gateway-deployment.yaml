apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-gateway
        app.kubernetes.io/part-of: claude-sandbox
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-gcp-sa.json: {{ .Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-gcp-sa.json: |
          {{`{{- with secret `}}{{ .Values.vault.secretPath | quote }}{{` -}}`}}
          {{`{{ .Data.data.key }}`}}
          {{`{{- end -}}`}}
    spec:
      runtimeClassName: kata
      serviceAccountName: claude-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: claude-gcp-auth
                optional: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /vault/secrets/gcp-sa.json
            - name: SANDBOX_WORKDIR
              value: /tmp/sandbox
            - name: TOKEN_TTL_SECONDS
              value: {{ .Values.gateway.tokenTTLSeconds | quote }}
            - name: MAX_REQUESTS_PER_HOUR
              value: {{ .Values.gateway.maxRequestsPerHour | quote }}
            - name: TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-signing-key
                  key: key
          resources:
            requests:
              cpu: {{ .Values.gateway.resources.requests.cpu | quote }}
              memory: {{ .Values.gateway.resources.requests.memory }}
            limits:
              cpu: {{ .Values.gateway.resources.limits.cpu | quote }}
              memory: {{ .Values.gateway.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: sandbox-workdir
              mountPath: /tmp/sandbox
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sandbox-workdir
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
