# ------------------------------------------------------------------------------
# To apply the GitLab token:
# - Uncomment the Secret below and set your token
# - Apply with: oc apply -f secret-gitlab-token.yaml
# - Restart the claude-gateway pods:
#     oc rollout restart deployment/claude-gateway -n claude-sandbox
# ------------------------------------------------------------------------------
# apiVersion: v1
# kind: Secret
# metadata:
#   name: gitlab-token
#   namespace: claude-sandbox
# type: Opaque
# stringData:
#   token: glpat-XXXXXXXXXXXXXXXXXXXX   # raw PAT, nothing else
