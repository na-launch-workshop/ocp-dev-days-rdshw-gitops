apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: claude-gateway
  namespace: {{ .Values.namespace }}
  annotations:
    haproxy.router.openshift.io/timeout: 300s
  labels:
    app.kubernetes.io/name: claude-gateway
    app.kubernetes.io/part-of: claude-sandbox
spec:
  to:
    kind: Service
    name: claude-gateway
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
  wildcardPolicy: None
