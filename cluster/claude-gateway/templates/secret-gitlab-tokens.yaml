{{- /*
  gitlab-user-tokens secret — create this manually before deploying.

  The gateway reads /etc/gitlab-tokens/tokens.json, which must be a flat JSON
  object mapping GitLab usernames to their deploy tokens:

    {
      "user1": "gldt-xxxxxxxxxxxxxxxxxxxx",
      "user2": "gldt-yyyyyyyyyyyyyyyyyyyy"
    }

  Deploy tokens need: read_repository + write_repository scopes.
  Create them per-user in GitLab → Settings → Repository → Deploy tokens,
  then build the secret:

    oc create secret generic gitlab-user-tokens \
      -n claude-sandbox \
      --from-literal=tokens.json='{"user1":"gldt-...","user2":"gldt-..."}'

  The volume mount in gateway-deployment.yaml picks this up automatically.
  The pod starts fine if the secret is absent (optional: true), but git tools
  will return "no GitLab token found" until it exists.
*/ -}}
