schemaVersion: 2.2.0
metadata:
  name: python-microservices
  displayName: Python Microservices — Claude Lab

components:
  - name: dev
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 2Gi
      cpuLimit: "1"
      mountSources: true
      env:
        - name: CLAUDE_GATEWAY_URL
          value: http://claude-gateway.claude-sandbox.svc:8080

commands:
  - id: start-claude
    exec:
      component: dev
      commandLine: python3.11 -m pip install -r ${PROJECT_SOURCE}/requirements.txt -q && python3.11 ${PROJECT_SOURCE}/claude-client/client.py chat ${DEVWORKSPACE_NAMESPACE}
      workingDir: ${PROJECT_SOURCE}
      label: "Start Claude AI"
      group:
        kind: run
