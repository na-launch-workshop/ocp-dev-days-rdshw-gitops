{{- $ns := include "parasol-troubleshooting.payments-ns" . -}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/name: parasol-payments
    app.kubernetes.io/part-of: payment-processor
    openshift.io/user-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-db
  namespace: {{ $ns }}
type: Opaque
stringData:
  PGUSER: payments
  PGPASSWORD: payments123
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-admin
  namespace: {{ $ns }}
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo
---
apiVersion: v1
kind: Secret
metadata:
  name: reporting-db
  namespace: {{ $ns }}
type: Opaque
stringData:
  PGUSER: reporting
  PGPASSWORD: reporting123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ $ns }}
data:
  init.sql: |
    CREATE TABLE reports (
      id SERIAL PRIMARY KEY,
      status VARCHAR(20) NOT NULL DEFAULT 'completed',
      value NUMERIC
    );
    INSERT INTO reports (status, value)
    SELECT
      CASE WHEN random() < 0.3 THEN 'pending' ELSE 'completed' END,
      round((random() * 1000)::numeric, 2)
    FROM generate_series(1, 100);
    CREATE USER reporting WITH PASSWORD 'reporting123';
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO reporting;
    CREATE USER payments WITH PASSWORD 'payments123';
    GRANT SELECT ON ALL TABLES IN SCHEMA public TO payments;
    ALTER SYSTEM SET max_connections = 20;
    SELECT pg_reload_conf();
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-config
  namespace: {{ $ns }}
data:
  queries.yaml: |
    global_connections:
      query: |
        SELECT
          sum(numbackends) as connections_total,
          (SELECT setting::int FROM pg_settings WHERE name = 'max_connections') as max_connections
        FROM pg_stat_database
      master: true
      metrics:
        - connections_total:
            usage: "GAUGE"
            description: "Total number of connections across all databases"
        - max_connections:
            usage: "GAUGE"
            description: "Maximum allowed connections server-wide"
    connection_states:
      query: |
        SELECT
          state,
          count(*) as connections
        FROM pg_stat_activity
        WHERE state IS NOT NULL
        GROUP BY state
      master: true
      metrics:
        - state:
            usage: "LABEL"
            description: "Connection state"
        - connections:
            usage: "GAUGE"
            description: "Number of connections in this state"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: {{ $ns }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    app: postgres
    app.kubernetes.io/part-of: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: payment-processor
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: demo
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          ports:
            - containerPort: 9187
              name: metrics
          env:
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-admin
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_URI
              value: localhost:5432/demo?sslmode=disable
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres_exporter/queries.yaml
          volumeMounts:
            - name: postgres-exporter-config
              mountPath: /etc/postgres_exporter
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
        - name: postgres-exporter-config
          configMap:
            name: postgres-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ $ns }}
  labels:
    app: postgres
    app.kubernetes.io/part-of: payment-processor
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
    - port: 9187
      targetPort: 9187
      name: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: {{ $ns }}
  labels:
    app: payments-api
    app.kubernetes.io/part-of: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        app.kubernetes.io/part-of: payment-processor
    spec:
      containers:
        - name: payments-api
          image: quay.io/afalossi/ts01-payments-api:v1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - containerPort: 8081
              name: metrics
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: payments-db
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-db
                  key: PGPASSWORD
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: demo
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: {{ $ns }}
  labels:
    app: payments-api
    app.kubernetes.io/part-of: payment-processor
spec:
  selector:
    app: payments-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 8081
      targetPort: 8081
      name: metrics
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: payments-api
  namespace: {{ $ns }}
spec:
  to:
    kind: Service
    name: payments-api
  port:
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-service
  namespace: {{ $ns }}
  labels:
    app: reporting-service
    app.kubernetes.io/part-of: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-service
  template:
    metadata:
      labels:
        app: reporting-service
        app.kubernetes.io/part-of: payment-processor
    spec:
      containers:
        - name: reporting-service
          image: quay.io/afalossi/ts01-reporting-service:v1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: metrics
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: PGUSER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: reporting-db
                  key: PGPASSWORD
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: demo
---
apiVersion: v1
kind: Service
metadata:
  name: reporting-service
  namespace: {{ $ns }}
  labels:
    app: reporting-service
    app.kubernetes.io/part-of: payment-processor
spec:
  selector:
    app: reporting-service
  ports:
    - port: 8081
      targetPort: 8081
      name: metrics
