tenant:
  username: ""
  openshiftUser: ""
  password: ""

kafka:
  clusterName: my-cluster
  version: 4.1.0
  metadataVersion: 4.1-IV1
  dualRole:
    replicas: 1
    resources:
      memory: 512Mi
      cpu: 200m
  topologyMarker:
    runtime: redhat
    partOf: my-cluster-topology
  config:
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1
    defaultReplicationFactor: 1
    minInsyncReplicas: 1

