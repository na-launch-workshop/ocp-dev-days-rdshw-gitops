apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-proxy-route
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.connectivityLink.aiGateway.gatewayName }}
      namespace: {{ .Values.connectivityLink.aiGateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /{{ .Values.tenant.username }}/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: Host
                value: {{ (urlParse .Values.litellm.url).host | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.connectivityLink.llmApi.serviceName }}
          namespace: {{ .Values.connectivityLink.llmApi.namespace }}
          port: 443
          weight: 1
