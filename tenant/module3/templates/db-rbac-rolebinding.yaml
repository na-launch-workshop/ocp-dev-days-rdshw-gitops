apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant.openshiftUser }}-view
  namespace: {{ .Values.sharedDatabase.namespace }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-db-viewer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ .Values.tenant.openshiftUser }}
