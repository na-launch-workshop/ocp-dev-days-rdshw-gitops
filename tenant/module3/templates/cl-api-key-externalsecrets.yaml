{{- $kuadrantNs := .Values.connectivityLink.kuadrantNamespace }}
{{- $username := .Values.tenant.username }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: m3-api-key-silver-{{ $username }}
  namespace: {{ $kuadrantNs }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  data:
    - secretKey: maasKey
      remoteRef:
        key: secrets/litellm/credentials
        property: api_key
    - secretKey: silverApiKey
      remoteRef:
        key: secrets/tenants/{{ $username }}/kuadrant
        property: silver_api_key
  target:
    name: m3-api-key-silver-{{ $username }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata:
        annotations:
          secret.kuadrant.io/upstream-token: "Bearer {{ "{{ .maasKey }}" }}"
          kuadrant.io/groups: silver
          secret.kuadrant.io/user-id: {{ $username | quote }}
        labels:
          authorino.kuadrant.io/managed-by: authorino
          app: my-llm-{{ $username }}
      data:
        api_key: "{{ "{{ .silverApiKey }}" }}"
