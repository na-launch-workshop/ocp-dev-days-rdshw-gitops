{{- $username := .Values.tenant.username }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lab-config
  namespace: {{ include "user-workload.namespace" . }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  data:
    - secretKey: s3AccessKey
      remoteRef:
        key: secrets/s3/noobaa
        property: accessKey
    - secretKey: s3SecretKey
      remoteRef:
        key: secrets/s3/noobaa
        property: secretKey
    - secretKey: s3Endpoint
      remoteRef:
        key: secrets/s3/noobaa
        property: endpoint
    - secretKey: maasKey
      remoteRef:
        key: secrets/litellm/credentials
        property: api_key
    - secretKey: maasUrl
      remoteRef:
        key: secrets/litellm/credentials
        property: base_url
    - secretKey: matrixToken
      remoteRef:
        key: secrets/tenants/{{ $username }}/matrix
        property: token
    - secretKey: matrixRoom
      remoteRef:
        key: secrets/tenants/{{ $username }}/matrix
        property: room
    - secretKey: rcUserId
      remoteRef:
        key: secrets/tenants/{{ $username }}/rocketchat
        property: userId
    - secretKey: rcToken
      remoteRef:
        key: secrets/tenants/{{ $username }}/rocketchat
        property: token
    - secretKey: silverApiKey
      remoteRef:
        key: secrets/tenants/{{ $username }}/kuadrant
        property: silver_api_key
    - secretKey: goldApiKey
      remoteRef:
        key: secrets/tenants/{{ $username }}/kuadrant
        property: gold_api_key
    - secretKey: hdGroupId
      remoteRef:
        key: secrets/tenants/{{ $username }}/helpdesk
        property: groupId
    - secretKey: hdTypeIdIssue
      remoteRef:
        key: secrets/tenants/{{ $username }}/helpdesk
        property: typeIdIssue
    - secretKey: hdPriorityIdNormal
      remoteRef:
        key: secrets/tenants/{{ $username }}/helpdesk
        property: priorityIdNormal
    - secretKey: hdUsername
      remoteRef:
        key: secrets/tenants/{{ $username }}/helpdesk
        property: username
    - secretKey: hdPassword
      remoteRef:
        key: secrets/tenants/{{ $username }}/helpdesk
        property: password
  target:
    name: lab-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        config: |
          # Helpdesk (per-user)
          helpdesk_username={{ "{{ .hdUsername }}" }}
          helpdesk_password={{ "{{ .hdPassword }}" }}
          helpdesk_group_id={{ "{{ .hdGroupId }}" }}

          # Helpdesk (shared)
          helpdesk_url=https://helpdesk-{{ .Values.helpdesk.namespace }}.{{ .Values.cluster.appsDomain }}
          helpdesk_type_id_issue={{ "{{ .hdTypeIdIssue }}" }}
          helpdesk_priority_id_normal={{ "{{ .hdPriorityIdNormal }}" }}

          # Database (per-user)
          db_username={{ $username }}
          db_password={{ "{{ .hdPassword }}" }}
          db_host=postgres.{{ .Values.sharedDatabase.namespace }}.svc.cluster.local
          db_port=5432
          db_database={{ .Values.sharedDatabase.database }}
          db_schema={{ $username }}

          # RocketChat (per-user)
          rocketchat_userid={{ "{{ .rcUserId }}" }}
          rocketchat_token={{ "{{ .rcToken }}" }}

          # Matrix (per-user)
          matrix_token={{ "{{ .matrixToken }}" }}
          matrix_room={{ "{{ .matrixRoom }}" }}

          # Matrix (shared)
          matrix_url=https://element-{{ .Values.matrix.namespace }}.{{ .Values.cluster.appsDomain }}

          # S3 (shared)
          s3_access_key={{ "{{ .s3AccessKey }}" }}
          s3_secret_key={{ "{{ .s3SecretKey }}" }}
          s3_endpoint={{ "{{ .s3Endpoint }}" }}

          # S3 (per-user)
          s3_bucket={{ $username }}

          # MaaS / LLM (shared)
          maas_url={{ "{{ .maasUrl }}" }}

          # MaaS / LLM (per-user)
          maas_key={{ "{{ .maasKey }}" }}

          # AI Gateway (shared)
          internal_ai_gateway_url=http://{{ .Values.connectivityLink.aiGateway.gatewayName }}-{{ .Values.connectivityLink.aiGateway.gatewayClassName }}.{{ .Values.connectivityLink.aiGateway.namespace }}.svc.cluster.local

          # AI Gateway (per-user)
          internal_ai_http_route_url=http://{{ .Values.connectivityLink.aiGateway.gatewayName }}-{{ .Values.connectivityLink.aiGateway.gatewayClassName }}.{{ .Values.connectivityLink.aiGateway.namespace }}.svc.cluster.local/{{ $username }}/v1

          # Kuadrant API keys (per-user)
          kuadrant_silver_api_key={{ "{{ .silverApiKey }}" }}
          kuadrant_gold_api_key={{ "{{ .goldApiKey }}" }}
