apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.tenant.openshiftUser }}-gateway-viewer
  namespace: {{ .Values.connectivityLink.aiGateway.namespace }}
  labels:
    {{- include "user-workload.labels" . | nindent 4 }}
subjects:
  - kind: User
    name: {{ .Values.tenant.openshiftUser }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: gateway-viewer
  apiGroup: rbac.authorization.k8s.io
