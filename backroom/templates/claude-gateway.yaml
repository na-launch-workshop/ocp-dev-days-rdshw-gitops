{{- if .Values.aiSandbox.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "backroom.metadata" (dict "name" .Values.aiSandbox.claudeGateway.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.aiSandbox.claudeGateway.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/claude-gateway
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
{{ include "backroom.syncPolicy" . | indent 2 }}
{{- end }}
