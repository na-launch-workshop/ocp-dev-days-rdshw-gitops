{{- if .Values.aiSandbox.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "backroom.metadata" (dict "name" .Values.aiSandbox.sandboxedContainers.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.aiSandbox.sandboxedContainers.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: cluster/sandboxed-containers
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        subscription:
          source: {{ .Values.catalogSource.source }}
{{ include "backroom.syncPolicy" . | indent 2 }}
{{- end }}
